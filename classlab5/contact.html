<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to bottom, #edf7ee, #f9fbf8);
        color: #183828;
      }

      .site-header {
        background: rgba(17, 51, 33, 0.9);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .navbar {
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 30px;
      }

      .logo {
        color: white;
        font-size: 1.5rem;
        font-weight: bold;
      }

      .nav-links {
        list-style: none;
        display: flex;
        gap: 25px;
        margin: 0;
        padding: 0;
      }

      .nav-links a {
        color: white;
        text-decoration: none;
        font-weight: 600;
      }

      .nav-links a:hover {
        color: #d1fae5;
      }

      .hero {
        position: relative;
        height: 45vh;
        min-height: 300px;
        background-image: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80');
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
      }

      .hero-content {
        position: relative;
        z-index: 1;
        text-align: center;
        color: white;
        padding: 20px;
      }

      .hero-content h1 {
        font-size: 3rem;
        margin: 0;
      }

      .contact-wrap {
        max-width: 900px;
        margin: 50px auto;
        padding: 0 20px 60px;
      }

      .contact-box {
        background: white;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 30px;
      }

      .contact-box h2 {
        margin-top: 0;
        font-size: 2rem;
      }

      .contact-box p {
        line-height: 1.7;
        font-size: 1.05rem;
      }

      .socials {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin-top: 25px;
      }

      .social-btn {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 999px;
        color: white;
        text-decoration: none;
        font-weight: bold;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .social-btn:hover {
        transform: translateY(-2px);
        opacity: 0.9;
      }

      .tiktok { background: #000000; }
      .facebook { background: #1877f2; }
      .instagram { background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af, #515bd4); }
      .twitter { background: #1da1f2; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar">
        <div class="logo">Lab5</div>
        <ul class="nav-links">
          <li><a href="lab5.html">Home</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="contact.html">Contact Us</a></li>
        </ul>
      </nav>
    </header>

    <section class="hero">
      <div class="hero-content">
        <h1>Contact Us</h1>
      </div>
    </section>

    <main class="contact-wrap">
      <div class="contact-box">
        <h2>Let’s Connect</h2>
        <p>
          We’d love to hear from you about your web design ideas, projects, and questions.
          Follow us on social media or reach out through the platforms below.
        </p>

        <div class="socials">
          <a class="social-btn tiktok" href="https://www.tiktok.com" target="_blank" rel="noopener noreferrer">TikTok</a>
          <a class="social-btn facebook" href="https://www.facebook.com" target="_blank" rel="noopener noreferrer">Facebook</a>
          <a class="social-btn instagram" href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">Instagram</a>
          <a class="social-btn twitter" href="https://twitter.com" target="_blank" rel="noopener noreferrer">Twitter</a>
        </div>
      </div>
    </main>
  </body>
</html>
